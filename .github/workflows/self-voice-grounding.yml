name: Self-voice grounding (isolated tests)

on:
  push:
    branches:
      - fix/self-voice-grounding-20261119
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install focused CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run isolated conversational supervision regressions
        run: python -m pytest -q tests/test_self_voice_grounding.py
